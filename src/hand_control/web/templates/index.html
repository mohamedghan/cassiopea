<!DOCTYPE html>
<html>
<head>
    <title>Finger Control</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        h1 { color: #4CAF50; text-align: center; }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .video-container {
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
        }
        .controls {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            min-width: 300px;
        }
        .finger-control {
            margin: 15px 0;
        }
        .finger-control label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .finger-control input[type="range"] {
            width: 100%;
            height: 20px;
        }
        .thumb { color: #FF00FF; }
        .index { color: #00FFFF; }
        .middle { color: #00FF00; }
        .ring { color: #FFFF00; }
        .pinky { color: #FF0000; }

        .presets {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            background: #2196F3;
        }
        button:hover { opacity: 0.8; }
        .btn-open { background: #4CAF50; }
        .btn-close { background: #f44336; }

        .status-bar {
            margin-top: 15px;
            padding: 10px;
            background: #0f0f23;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .info {
            background: #2d2d44;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        .strategy-section {
            background: #2d2d44;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .strategy-section h4 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        .strategy-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .strategy-toggle label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .ratio-controls {
            margin-top: 10px;
        }
        .ratio-controls label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .ratio-controls input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Finger-by-Finger Robot Control</h1>

    <div class="container">
        <div class="video-container">
            <img src="/video_feed" width="640" height="480">
        </div>

        <div class="controls">
            <div class="info">
                Servo range: 0 (closed) - {{ max_angle }} (open)<br>
                Tracks one hand even with multiple hands visible
            </div>

            <div class="strategy-section">
                <h4>Angle Strategy</h4>
                <div class="strategy-toggle">
                    <label>
                        <input type="radio" name="strategy" value="distance" checked onchange="setStrategy('distance')">
                        Distance (faster)
                    </label>
                    <label>
                        <input type="radio" name="strategy" value="joint_angle" onchange="setStrategy('joint_angle')">
                        Joint Angle
                    </label>
                </div>
                <div class="ratio-controls" id="ratio-controls">
                    <label>Ratio Min (closed): <span id="ratio-min-val">0.5</span></label>
                    <input type="range" id="ratio-min" min="0.1" max="1.5" step="0.05" value="0.5"
                           oninput="updateRatio()">
                    <label>Ratio Max (open): <span id="ratio-max-val">2.0</span></label>
                    <input type="range" id="ratio-max" min="1.0" max="3.0" step="0.05" value="2.0"
                           oninput="updateRatio()">
                </div>
            </div>

            <h3>Manual Finger Control</h3>

            <div class="finger-control">
                <label class="thumb">Thumb: <span id="thumb-val">{{ max_angle }}</span></label>
                <input type="range" id="thumb" min="0" max="{{ max_angle }}" value="{{ max_angle }}"
                       oninput="sendFinger(0, this.value); document.getElementById('thumb-val').innerText=this.value">
            </div>

            <div class="finger-control">
                <label class="index">Index: <span id="index-val">{{ max_angle }}</span></label>
                <input type="range" id="index" min="0" max="{{ max_angle }}" value="{{ max_angle }}"
                       oninput="sendFinger(1, this.value); document.getElementById('index-val').innerText=this.value">
            </div>

            <div class="finger-control">
                <label class="middle">Middle: <span id="middle-val">{{ max_angle }}</span></label>
                <input type="range" id="middle" min="0" max="{{ max_angle }}" value="{{ max_angle }}"
                       oninput="sendFinger(2, this.value); document.getElementById('middle-val').innerText=this.value">
            </div>

            <div class="finger-control">
                <label class="ring">Ring: <span id="ring-val">{{ max_angle }}</span></label>
                <input type="range" id="ring" min="0" max="{{ max_angle }}" value="{{ max_angle }}"
                       oninput="sendFinger(3, this.value); document.getElementById('ring-val').innerText=this.value">
            </div>

            <div class="finger-control">
                <label class="pinky">Pinky: <span id="pinky-val">{{ max_angle }}</span></label>
                <input type="range" id="pinky" min="0" max="{{ max_angle }}" value="{{ max_angle }}"
                       oninput="sendFinger(4, this.value); document.getElementById('pinky-val').innerText=this.value">
            </div>

            <div class="presets">
                <button class="btn-open" onclick="preset('open')">Open All</button>
                <button class="btn-close" onclick="preset('close')">Close All</button>
                <button onclick="preset('point')">Point</button>
                <button onclick="preset('peace')">Peace</button>
                <button onclick="preset('rock')">Rock</button>
                <button onclick="preset('ok')">OK</button>
            </div>

            <div class="status-bar">
                <div>Arduino: <span id="arduino-status">Checking...</span></div>
                <div>Strategy: <span id="strategy-status">distance</span></div>
                <div>Detected: T:<span id="d-thumb">-</span> I:<span id="d-index">-</span> M:<span id="d-middle">-</span> R:<span id="d-ring">-</span> P:<span id="d-pinky">-</span></div>
            </div>
        </div>
    </div>

    <script>
        const MAX_ANGLE = {{ max_angle }};

        async function sendFinger(finger, angle) {
            await fetch(`/finger/${finger}/${angle}`);
        }

        async function preset(name) {
            const presets = {
                'open': [MAX_ANGLE, MAX_ANGLE, MAX_ANGLE, MAX_ANGLE, MAX_ANGLE],
                'close': [0, 0, 0, 0, 0],
                'point': [0, MAX_ANGLE, 0, 0, 0],
                'peace': [0, MAX_ANGLE, MAX_ANGLE, 0, 0],
                'rock': [0, MAX_ANGLE, 0, 0, MAX_ANGLE],
                'ok': [MAX_ANGLE, 0, MAX_ANGLE, MAX_ANGLE, MAX_ANGLE]
            };

            const angles = presets[name];
            if (angles) {
                await fetch(`/all/${angles.join(',')}`);
                updateSliders(angles);
            }
        }

        function updateSliders(angles) {
            const fingers = ['thumb', 'index', 'middle', 'ring', 'pinky'];
            fingers.forEach((f, i) => {
                document.getElementById(f).value = angles[i];
                document.getElementById(f + '-val').innerText = angles[i];
            });
        }

        async function updateStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                document.getElementById('arduino-status').innerText =
                    data.arduino_connected ? 'Connected' : 'Disconnected';

                document.getElementById('d-thumb').innerText = data.angles.thumb;
                document.getElementById('d-index').innerText = data.angles.index;
                document.getElementById('d-middle').innerText = data.angles.middle;
                document.getElementById('d-ring').innerText = data.angles.ring;
                document.getElementById('d-pinky').innerText = data.angles.pinky;
            } catch (e) {
                console.error(e);
            }
        }

        async function setStrategy(name) {
            await fetch(`/strategy/${name}`);
            document.getElementById('ratio-controls').style.display =
                name === 'distance' ? 'block' : 'none';
        }

        async function updateRatio() {
            const min = document.getElementById('ratio-min').value;
            const max = document.getElementById('ratio-max').value;
            document.getElementById('ratio-min-val').innerText = min;
            document.getElementById('ratio-max-val').innerText = max;
            await fetch(`/ratio/${min}/${max}`);
        }

        async function loadStrategy() {
            try {
                const res = await fetch('/strategy');
                const data = await res.json();
                document.querySelector(`input[name="strategy"][value="${data.strategy}"]`).checked = true;
                document.getElementById('ratio-min').value = data.ratio_min;
                document.getElementById('ratio-max').value = data.ratio_max;
                document.getElementById('ratio-min-val').innerText = data.ratio_min;
                document.getElementById('ratio-max-val').innerText = data.ratio_max;
                document.getElementById('strategy-status').innerText = data.strategy;
                document.getElementById('ratio-controls').style.display =
                    data.strategy === 'distance' ? 'block' : 'none';
            } catch (e) {
                console.error(e);
            }
        }

        loadStrategy();
        setInterval(updateStatus, 200);
    </script>
</body>
</html>
