<!DOCTYPE html>
<html>
<head>
    <title>CASSI — Event Presentation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
        .layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr auto;
            height: 100vh;
            gap: 0;
        }
        .pane {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        .pane img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
        }
        .status-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 12px 24px;
            background: #111;
            border-top: 1px solid #222;
            font-size: 13px;
            font-family: monospace;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
        }
        .status-dot.connected { background: #4CAF50; }
        .status-dot.disconnected { background: #f44336; }
        .finger-dots {
            display: flex;
            gap: 6px;
        }
        .finger-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .finger-dot.thumb { background: #FF00FF; }
        .finger-dot.index { background: #00FFFF; }
        .finger-dot.middle { background: #00FF00; }
        .finger-dot.ring { background: #FFFF00; }
        .finger-dot.pinky { background: #FF0000; }
        .legend {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            color: #ccc;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
        }
        .legend-title {
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .swatch-cold { background: #0000FF; }
        .swatch-warm { background: #FF0000; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="pane">
            <img src="/video_feed" alt="Camera Feed">
            <div class="label">Camera + Landmarks</div>
        </div>
        <div class="pane">
            <img src="/presentation_feed" id="composite-img" alt="Composite Feed">
            <div class="label">Depth Maps</div>
            <div class="legend">
                <div class="legend-title">Depth Legend</div>
                <div class="legend-row">
                    <div class="legend-swatch swatch-cold"></div>
                    <span>Near</span>
                </div>
                <div class="legend-row">
                    <div class="legend-swatch swatch-warm"></div>
                    <span>Far</span>
                </div>
            </div>
        </div>
        <div class="pane">
            <img src="/video_feed" style="display:none" alt="">
            <div class="label" style="background:transparent"></div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="arduino-dot"></div>
                <span>Arduino: <span id="arduino-status">—</span></span>
            </div>
            <div class="status-item">
                <span>Strategy: <span id="strategy-status">—</span></span>
            </div>
            <div class="status-item">
                <span>Detected:</span>
                <div class="finger-dots">
                    <div class="finger-dot thumb" title="Thumb"></div>
                    <div class="finger-dot index" title="Index"></div>
                    <div class="finger-dot middle" title="Middle"></div>
                    <div class="finger-dot ring" title="Ring"></div>
                    <div class="finger-dot pinky" title="Pinky"></div>
                </div>
                <span id="finger-angles" style="min-width: 120px"></span>
            </div>
        </div>
    </div>

    <script>
        async function updateStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                const dot = document.getElementById('arduino-dot');
                dot.className = 'status-dot ' + (data.arduino_connected ? 'connected' : 'disconnected');
                document.getElementById('arduino-status').innerText =
                    data.arduino_connected ? 'Connected' : 'Disconnected';

                const a = data.angles;
                document.getElementById('finger-angles').innerText =
                    `T:${a.thumb} I:${a.index} M:${a.middle} R:${a.ring} P:${a.pinky}`;
            } catch (e) {
                console.error(e);
            }
        }

        async function loadStrategy() {
            try {
                const res = await fetch('/strategy');
                const data = await res.json();
                document.getElementById('strategy-status').innerText = data.strategy;
            } catch (e) {
                console.error(e);
            }
        }

        loadStrategy();
        setInterval(updateStatus, 200);
    </script>
</body>
</html>
