[project]
name = "hand-control"
version = "1.0.0"
description = "Robotic hand control system using MediaPipe and Arduino"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["robotics", "mediapipe", "arduino", "hand-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "flask>=3.1.0",
    "mediapipe>=0.10.34",
    "numpy>=2.2.0",
    "opencv-python>=4.13.0",
    "pyrealsense2>=2.58.0",
    "pyserial>=3.5",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
hand-control = "hand_control.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hand_control"]

# ============ RUFF CONFIGURATION ============
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "ANN",    # flake8-annotations (type hints)
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hand_control"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]
"src/hand_control/web/templates/*.html" = ["F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============ MYPY CONFIGURATION ============
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mediapipe.*",
    "pyrealsense2.*",
    "serial.*",
    "scipy.*",
]
ignore_missing_imports = true

# ============ PYTEST CONFIGURATION ============
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["src/hand_control"]
omit = ["*/__main__.py"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
extraPaths = ["src", "/home/meddabeast/projects/CASSI/env/lib/python3.14/site-packages"]
