services:
  hand-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robotic-hand-control

    # Explicit device mapping (more secure than privileged mode)
    devices:
      - /dev/ttyACM0:/dev/ttyACM0   # Arduino serial port
      - /dev/bus/usb:/dev/bus/usb   # RealSense D435i (pyrealsense2 uses libusb, not V4L2)

    # Volume mounts
    volumes:
      - /run/udev:/run/udev:ro  # udev for device hotplug (required for USB enumeration)

    # Environment variables
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM0}
      - BAUD_RATE=${BAUD_RATE:-115200}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - MAX_SERVO_ANGLE=${MAX_SERVO_ANGLE:-120}
      - REALSENSE_WIDTH=${REALSENSE_WIDTH:-640}
      - REALSENSE_HEIGHT=${REALSENSE_HEIGHT:-480}
      - REALSENSE_FPS=${REALSENSE_FPS:-30}
      - HAND_DETECTION_CONFIDENCE=${HAND_DETECTION_CONFIDENCE:-0.5}
      - HAND_TRACKING_CONFIDENCE=${HAND_TRACKING_CONFIDENCE:-0.5}
      - MAX_NUM_HANDS=${MAX_NUM_HANDS:-2}
      - FILTER_MIN_CUTOFF=${FILTER_MIN_CUTOFF:-0.5}
      - FILTER_BETA=${FILTER_BETA:-0.01}

    # Port mapping
    ports:
      - "5000:5000"

    # Group memberships for device access
    group_add:
      - dialout  # For serial port access (Arduino)
      - plugdev  # For USB device access via udev rules (RealSense)

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
